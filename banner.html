<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    background: rgba(255,255,255,0.95);
    text-align: center;
  }
  button {
    margin: 10px;
    padding: 8px 16px;
    font-size: 13px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #007aff;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <button id="buy-btn" aria-label="Замовити">Замовити</button>

  <script>
    (function(){
      const targetUrl = 'https://yourshop.com/halloween-model'; // 🔗 Укажи свой HTTPS URL
      function notifyParent(url) {
        window.postMessage(JSON.stringify({ type: 'quicklook_button', url: url }), '*');
      }
      document.getElementById('buy-btn').addEventListener('click', () => notifyParent(targetUrl));
    })();
  </script>
</body>
</html>
