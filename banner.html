<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <!-- Подключаем современный шрифт (замени при необходимости) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      height: 100%;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* затемнённый фон */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* брендовая кнопка */
    .btn {
      background: linear-gradient(135deg, #ff2d55, #ff6a00); /* пример брендового цвета — можешь заменить */
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 26px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 20px rgba(255, 80, 0, 0.35);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(255, 80, 0, 0.45);
      opacity: 0.95;
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 12px rgba(255, 80, 0, 0.25);
    }
  </style>
</head>
<body>
  <div class="overlay">
    <button class="btn" aria-label="Замовити">Замовити</button>
  </div>
</body>
</html>
