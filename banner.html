<!doctype html>
<html lang="eng">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <style>
    /* Подключаем шрифт Boldstorm */
    @font-face {
      font-family: 'Boldstorm';
      src: url('https://raw.githubusercontent.com/Vitalii-hton/weisworld1/main/fonts/BoldstromD.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      height: 100%;
      font-family: 'Boldstorm', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* затемнённый фон */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.50);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* брендовая кнопка */
    .btn {
      background: #FFDC51; /* заменено на чистый брендовый цвет */
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.4px;
      font-family: 'Boldstorm', sans-serif;
      box-shadow: 0 4px 20px rgba(255, 45, 85, 0.35);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(255, 45, 85, 0.45);
      opacity: 0.95;
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 12px rgba(255, 45, 85, 0.25);
    }
  </style>
</head>
<body>
  <div class="overlay">
    <button class="btn" aria-label="Form">Form</button>
  </div>
</body>
</html>
