<!DOCTYPE html>
<html lang="ukr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Quick Look — Archangel Michael</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    /* Стили кнопки */
    .ar-button {
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 20px;
    }
    .ar-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body style="text-align:center; padding:50px; font-family:sans-serif;">
  <h1>AR Michael</h1>
  <p>iPhone/iPad only:</p>

  <!-- Кнопка для ручного запуска AR -->
  <button id="ar-button" class="ar-button">
    📱 Open AR
  </button>

  <script>
    const arButton = document.getElementById('ar-button');

    arButton.addEventListener('click', () => {
      // Создаем временный model-viewer, только для запуска AR
      const modelViewer = document.createElement('model-viewer');
      modelViewer.setAttribute('src', 'https://vitalii-hton.github.io/weisworld1/halloween.glb');
      modelViewer.setAttribute('ios-src', 'https://vitalii-hton.github.io/weisworld1/halloween22.usdz');
      modelViewer.setAttribute('ar', '');
      modelViewer.setAttribute('ar-modes', 'quick-look');
      modelViewer.style.display = 'none'; // не показываем предпросмотр на странице
      document.body.appendChild(modelViewer);
      modelViewer.activateAR();
    });
  </script>
</body>
</html>
