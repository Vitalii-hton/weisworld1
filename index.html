<!DOCTYPE html>
<html lang="ukr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Quick Look — Archangel Michael</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    /* Стили кнопки */
    .ar-button {
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 20px;
    }
    .ar-button:hover {
      background-color: #0056b3;
    }
    model-viewer {
      width: 100%;
      max-width: 600px;
      height: 500px;
      border-radius: 12px;
      background: #f0f0f0;
      margin-top: 20px;
    }
  </style>
</head>
<body style="text-align:center; padding:50px; font-family:sans-serif;">
  <h1>AR Michael</h1>
  <p>iPhone/iPad only:</p>

  <!-- Кнопка для ручного запуска AR -->
  <button id="ar-button" class="ar-button">
    📱 Open AR
  </button>

  <!-- Кнопка для открытия во внешнем браузере (Safari/Chrome), скрыта по умолчанию -->
  <button id="open-browser" class="ar-button" style="display:none;">
    🌐 Open in Safari/Chrome
  </button>

  <!-- 3D-предпросмотр -->
  <model-viewer
    id="ar-viewer"
    src="https://vitalii-hton.github.io/weisworld1/halloween.glb"
    ios-src="https://vitalii-hton.github.io/weisworld1/halloween22.usdz#checkoutTitle=Moon%20X&checkoutSubtitle=Hello%20Kitty&price=%2419.99&callToAction=%D0%9A%D1%83%D0%BF%D0%B8%D1%82%D1%8C"
    alt="3D Model"
    camera-controls
    auto-rotate
    ar
    ar-modes="quick-look"
    style="width:100%; height:500px;">
  </model-viewer>

  <!-- Скрытая кнопка для автозапуска -->
  <button id="hidden-ar-button" style="display:none;"></button>

  <script>
    const arButton = document.getElementById('ar-button');
    const arViewer = document.getElementById('ar-viewer');

    // обычная кнопка запуска AR
    arButton.addEventListener('click', () => {
      arViewer.activateAR();
    });

    // скрытая кнопка для автозапуска
    const hiddenBtn = document.getElementById('hidden-ar-button');
    hiddenBtn.addEventListener("click", () => {
      arViewer.activateAR();
    });

    // имитация клика по скрытой кнопке через 1.5 сек
    window.addEventListener("load", () => {
      setTimeout(() => {
        hiddenBtn.click();
      }, 1500);
    });

  // ===============================
  // ЛОГИКА для кнопки "Open in Safari/Chrome"
  // ===============================
  (function() {
    const openBtn = document.getElementById('open-browser');
    const url = window.location.href; 
    const ua = navigator.userAgent || '';

    const isInAppBrowser = /Instagram|FBAN|FBAV|FBSV|FB_IAB/i.test(ua);
    if (!isInAppBrowser) {
      openBtn.style.display = 'none';
    } else {
      openBtn.style.display = 'inline-block';
    }

    function tryOpen(urlToOpen) {
      const a = document.createElement('a');
      a.href = urlToOpen;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>{ try { document.body.removeChild(a); } catch(e){} }, 2000);
    }

    function openInExternalBrowser() {
      const xSafari = 'x-safari-https://' + url.replace(/^https?:\/\//i, '');
      const safariTab = 'com-apple-mobilesafari-tab:' + url;
      const intentUrl = 'intent://' + url.replace(/^https?:\/\//i, '') +
                        '#Intent;scheme=https;package=com.android.chrome;end';

      tryOpen(xSafari);
      setTimeout(()=> tryOpen(safariTab), 300);
      setTimeout(()=> tryOpen(intentUrl), 700);
      setTimeout(()=> tryOpen(url), 1100);
      setTimeout(()=> {
        try { window.open(url, '_blank', 'noopener'); } catch(e){}
      }, 1400);
    }

    openBtn.addEventListener('click', (e) => {
      e.preventDefault();
      openInExternalBrowser();
      setTimeout(()=> {
        if (confirm('Если сайт всё ещё открыт внутри Instagram и AR не работает — открыть инструкцию, как запустить в Safari?')) {
          window.location.href = '/open-in-safari-instructions.html';
        }
      }, 1600);
    });
  })();

  // ===============================
  // 👉 ДОБАВЬ ВОТ ЭТОТ БЛОК
  // ===============================
  const viewer = document.getElementById('ar-viewer');
  viewer.addEventListener('quick-look-button-tapped', () => {
    window.open(
      'https://moonoralbeauty.com/products/moon-x-hello-kitty%C2%AE-teeth-whitening-pen-duo',
      '_blank'
    );
  });
</script>
</body>
</html>
